{{- $effectiveDriverConfig := include "dra-driver-cpu.effectiveDriverConfig" . | fromYaml }}
{{- $kubeletRoot := include "dra-driver-cpu.kubeletRootDir" . }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dra-driver-cpu.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dra-driver-cpu.labels" . | nindent 4 }}
    tier: node
    k8s-app: {{ include "dra-driver-cpu.name" . }}
spec:
  selector:
    matchLabels:
      {{- include "dra-driver-cpu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dra-driver-cpu.labels" . | nindent 8 }}
        tier: node
        k8s-app: {{ include "dra-driver-cpu.name" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if $effectiveDriverConfig }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dra-driver-cpu.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: dracpu
        args:
          - /dracpu
          - --v={{ .Values.args.logLevel }}
          {{- if .Values.healthzPort }}
          - --bind-address=:{{ .Values.healthzPort }}
          {{- end }}
          - --expose-pcie-roots={{ .Values.args.exposePCIeRoots }}
          {{- if ne $kubeletRoot "/var/lib/kubelet" }}
          - {{ printf "--kubelet-root-dir=%s" $kubeletRoot | quote }}
          {{- end }}
          {{- with .Values.extraArgs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if $effectiveDriverConfig }}
          - --config=/etc/dracpu/config.yaml
          {{- end }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: healthz
            containerPort: {{ .Values.healthzPort }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthzPath }}
            port: healthz
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: {{ .Values.healthzPath }}
            port: healthz
          initialDelaySeconds: 5
        resources:
          requests:
            {{- toYaml .Values.resources.requests | nindent 12 }}
          {{- with .Values.resources.limits }}
          limits:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        volumeMounts:
        - name: device-plugin
          mountPath: {{ include "dra-driver-cpu.pluginsDir" $kubeletRoot | quote }}
        - name: plugin-registry
          mountPath: {{ include "dra-driver-cpu.pluginRegistryDir" $kubeletRoot | quote }}
        - name: nri-plugin
          mountPath: /var/run/nri
        - name: cdi-dir
          mountPath: /var/run/cdi
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $effectiveDriverConfig }}
        - name: driver-config
          mountPath: /etc/dracpu
          readOnly: true
        {{- end }}
      volumes:
      - name: device-plugin
        hostPath:
          path: {{ include "dra-driver-cpu.pluginsDir" $kubeletRoot | quote }}
      - name: plugin-registry
        hostPath:
          path: {{ include "dra-driver-cpu.pluginRegistryDir" $kubeletRoot | quote }}
      - name: nri-plugin
        hostPath:
          path: /var/run/nri
      - name: cdi-dir
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $effectiveDriverConfig }}
      - name: driver-config
        configMap:
          name: {{ include "dra-driver-cpu.fullname" . }}-config
      {{- end }}
