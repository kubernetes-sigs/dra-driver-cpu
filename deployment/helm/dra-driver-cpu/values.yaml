---
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# @schema additionalProperties:false
image:
  # -- Container image repository
  repository: registry.k8s.io/dra-driver-cpu/dra-driver-cpu # @schema required:true
  # -- Image tag; defaults to `.Chart.AppVersion` when empty, which is set to the release tag at package time
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent # @schema required:true;enum:[Always, IfNotPresent, Never]

# -- List of image pull secrets
imagePullSecrets: []

# @schema additionalProperties:false
rbac:
  # -- Create RBAC resources (ClusterRole and ClusterRoleBinding)
  create: true # @schema type:boolean;required:true

serviceAccount:
  # -- Annotations to add to the ServiceAccount
  annotations: {}

# -- Annotations to add to pods
podAnnotations: {}
# -- Extra labels to add to pods
podLabels: {}

# -- Extra command-line arguments appended to the driver arguments
extraArgs: [] # @schema item: string

# -- Extra volume mounts for the driver container
extraVolumeMounts: [] # @schema item: object

# -- Extra volumes for the DaemonSet pod
extraVolumes: [] # @schema item: object

# @schema additionalProperties:false
resources:
  # @schema additionalProperties:false
  requests:
    # -- CPU resource request
    cpu: "100m"
    # -- Memory resource request
    memory: "50Mi"
  # -- Resource limits (unset by default)
  limits: {}

# -- Node tolerations; defaults to tolerating all NoSchedule taints
tolerations:
  - operator: "Exists" # @schema enum:[Exists, Equal]
    effect: "NoSchedule" # @schema enum:[NoSchedule, PreferNoSchedule, NoExecute]

# -- Node selector for scheduling the DaemonSet pods
nodeSelector: {}

# -- Affinity rules for scheduling the DaemonSet pods
affinity: {}

# @schema additionalProperties:false
args:
  # -- Log verbosity level passed as `--v`
  logLevel: 4 # @schema type:integer;minimum:0;required:true
  # -- **Deprecated:** folded into the generated `driverConfig` ConfigMap and takes priority over it; use `driverConfig.cpuDeviceMode` instead. CPU exposure mode: `grouped` (expose NUMA nodes or sockets as devices) or `individual` (expose each CPU as a device); defaults to `grouped` when empty.
  cpuDeviceMode: "" # @schema enum:["",grouped,individual];required:true
  # -- **Deprecated:** folded into the generated `driverConfig` ConfigMap and takes priority over it; use `driverConfig.groupBy` instead. Grouping criteria when `cpuDeviceMode=grouped`: `numanode`, `socket` or `machine`; defaults to `numanode` when empty.
  groupBy: "" # @schema enum:["",numanode,socket,machine];required:true
  # -- **Deprecated:** folded into the generated `driverConfig` ConfigMap and takes priority over it; use `driverConfig.reservedCPUs` instead. CPUs reserved for the OS and kubelet, excluded from DRA management (e.g. `"0-1"`).
  reservedCPUs: ""
  # -- **Deprecated:** folded into the generated `driverConfig` ConfigMap and takes priority over it; use `driverConfig.hostnameOverride` instead. Overrides the node name the driver registers under.
  hostnameOverride: ""
  # -- Discover and expose PCIe roots as device attributes. Requires the `DRAListTypeAttributes=true` feature gate in the cluster. Not configurable via `driverConfig`; use this flag instead
  exposePCIeRoots: false # @schema type:boolean

# -- Path for liveness and readiness probes
healthzPath: /healthz
# -- Port the HTTP server binds to; used for the container port and probes
healthzPort: 8080 # @schema type:integer;minimum:1;maximum:65535

# -- Kubelet base directory (the kubelet's own `--root-dir`). Only set this if
# the kubelet does not use the default. The hostPath mounts and the driver flag
# both derive from this value, so they cannot come apart. See
# https://github.com/kubernetes-sigs/dra-driver-cpu/blob/main/docs/user/configuration.md
# for details
kubeletRootDir: /var/lib/kubelet # @schema type:string;minLength:1;pattern:^/

# Example:
# driverConfig:
#   cpuDeviceMode: grouped
#   groupBy: socket
#   reservedCPUs: "0-3"
#   publishNodeAllocatableResourceMapping: true # requires the DRANodeAllocatableResources feature gate
#
# -- Driver config file contents. When non-empty, or when a deprecated
# `args.*` field below is set, a ConfigMap is created and mounted into the
# driver container as /etc/dracpu/config.yaml. `args.*` fields that mirror a
# deprecated CLI flag (`cpuDeviceMode`, `groupBy`, `reservedCPUs`,
# `hostnameOverride`) are folded into the generated config automatically and
# take priority over the same field set here.
driverConfig: {} # @schema $ref: ./driverconfig.schema.json
