[crio.image]
# kind preloads pause:3.10; CRI-O 1.37 defaults to 3.10.2, which would be pulled at runtime.
pause_image = "registry.k8s.io/pause:3.10"
[crio.runtime]
# The cri-o package defaults to crun. Use kind's runc, as containerd does,
# so the runtime under test is the only difference between the lanes.
default_runtime = "runc"
[crio.runtime.runtimes.runc]
runtime_path = "/usr/local/sbin/runc"
