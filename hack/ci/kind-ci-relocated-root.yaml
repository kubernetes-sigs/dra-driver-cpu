# Same as kind-ci.yaml, but every node runs its kubelet with a non-default
# --root-dir. This exercises the kubeletRootDir path end to end:
# the kubelet watches <root>/plugins_registry, and the driver must register its
# socket there rather than under /var/lib/kubelet.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  DRAListTypeAttributes: true
nodes:
- role: control-plane
  image: kindest/node:v1.36.0
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    scheduler:
        extraArgs:
          v: "5"
          vmodule: "allocator=6,dynamicresources=6" # structured/allocator.go, DRA scheduler plugin
    controllerManager:
        extraArgs:
          v: "5"
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
        root-dir: "/var/lib/custom-kubelet"
- role: worker
  image: kindest/node:v1.36.0
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
        root-dir: "/var/lib/custom-kubelet"
- role: worker
  image: kindest/node:v1.36.0
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
        root-dir: "/var/lib/custom-kubelet"
