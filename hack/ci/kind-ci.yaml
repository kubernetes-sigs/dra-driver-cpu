kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  # TODO: uncomment together with bumping KIND_K8S_VERSION to v1.37.0-beta.1 or
  # later; earlier releases do not recognize this gate and the cluster fails to start.
  # DRANodeAllocatableResources: true
  DRAListTypeAttributes: true
nodes:
# Node images are not pinned here: kind takes the image from the --image flag,
# which the Makefile sets to kindest/node:$(KIND_K8S_VERSION).
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    scheduler:
        extraArgs:
          v: "5"
          vmodule: "allocator=6,dynamicresources=6" # structured/allocator.go, DRA scheduler plugin
    controllerManager:
        extraArgs:
          v: "5"
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        v: "5"
