# Run instructions: docs/user/memory-poc.md
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: memory-separate-memory
spec:
  devices:
    requests:
    - name: memory
      exactly:
        deviceClassName: dra.memory
        count: 1
        capacity:
          requests:
            dra.cpu/size: 64Mi
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: memory-separate-hp2m
spec:
  devices:
    requests:
    - name: hp2m
      exactly:
        deviceClassName: dra.hugepages-2m
        count: 1
        capacity:
          requests:
            dra.cpu/size: 2Mi
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: memory-separate-hp1g
spec:
  devices:
    requests:
    - name: hp1g
      exactly:
        deviceClassName: dra.hugepages-1g
        count: 1
        capacity:
          requests:
            dra.cpu/size: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-separate
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: dra-cpu-memory-poc-worker
  containers:
  - name: probe
    image: dra-cpu-poc:local
    imagePullPolicy: Never
    command:
    - /dracputester
    - --memory-poc
    env:
    - name: POC_MEMORY_BYTES
      value: '67108864'
    - name: POC_HUGE_2M_BYTES
      value: '2097152'
    - name: POC_HUGE_1G_BYTES
      value: '1073741824'
    resources:
      claims:
      - name: memory-separate-memory
      - name: memory-separate-hp2m
      - name: memory-separate-hp1g
  resourceClaims:
  - name: memory-separate-memory
    resourceClaimName: memory-separate-memory
  - name: memory-separate-hp2m
    resourceClaimName: memory-separate-hp2m
  - name: memory-separate-hp1g
    resourceClaimName: memory-separate-hp1g
