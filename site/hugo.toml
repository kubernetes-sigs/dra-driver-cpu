baseURL = "https://dra-driver-cpu.sigs.k8s.io/"
title = "DRA Driver for CPU"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = true

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    contentDir = "content"
    weight = 1

# Hugo module (Docsy) configuration.
[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
    min = "0.157.0"
  [[module.imports]]
    path = "github.com/google/docsy"
    disable = false
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"
    disable = false

  # The documentation is authored in docs/ at the repository root, where it is
  # also read on GitHub. It is mounted into the assets of this site, not into
  # its content: the pages under content/ carry the navigation and pull the
  # prose in with the include-file shortcode, so there is no second copy.
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../docs"
    target = "assets/additional/docs"
    files = ["user/*.md", "dev/*.md"]
  # README.md is read on GitHub as the front page of the repository, and is
  # published here as the Overview page, which the home page redirects to. Like
  # the files under docs/, it is mounted instead of copied.
  [[module.mounts]]
    source = "../"
    target = "assets/additional"
    files = ["README.md"]
  # The images the documentation refers to are published as they are, so the
  # prose renders the same on GitHub and on the site.
  [[module.mounts]]
    source = "../docs/images"
    target = "static/docs/images"

# Markup
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  # Rewrite relative links between documentation pages, for example
  # "installation.md#compatibility", to their published URLs.
  [markup.goldmark.renderHooks.link]
    useEmbedded = "fallback"
  [markup.highlight]
    style = "tango"
    lineNos = false
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# Top navigation bar
[[menu.main]]
  name = "Documentation"
  weight = 10
  url = "/docs/"
[[menu.main]]
  name = "GitHub"
  weight = 20
  url = "https://github.com/kubernetes-sigs/dra-driver-cpu"
  pre = "<i class='fab fa-github'></i>"

# Site-wide parameters
[params]
  github_repo = "https://github.com/kubernetes-sigs/dra-driver-cpu"
  github_branch = "main"
  github_subdir = "site"
  github_project_repo = "https://github.com/kubernetes-sigs/dra-driver-cpu"
  offlineSearch = false
  prism_syntax_highlighting = false

  [params.taxonomy]
    taxonomyCloud = []
    taxonomyPageHeader = []

  [params.mermaid]
    enable = true

  [params.ui]
    breadcrumb_disable = false
    # The project does not ship a logo yet.
    navbar_logo = false
    navbar_translucent_over_cover_disable = false
    readingtime.enable = false
    sidebar_menu_compact = true
    sidebar_menu_foldable = true
    showLightDarkModeMenu = true
    # Search is disabled until a search engine is configured for the site.
    sidebar_search_disable = true

    [params.ui.feedback]
      enable = false

  [params.links]
    [[params.links.user]]
      name = "Kubernetes Slack #sig-node"
      url = "https://kubernetes.slack.com/messages/sig-node"
      icon = "fab fa-slack"
      desc = "Discussion and questions on Kubernetes SIG Node"
    [[params.links.developer]]
      name = "GitHub"
      url = "https://github.com/kubernetes-sigs/dra-driver-cpu"
      icon = "fab fa-github"
      desc = "Source code and issue tracker"

# Output formats — required for Docsy search & sitemaps
[outputs]
  home = ["HTML", "RSS", "SITEMAP"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.SITEMAP]
    mediaType = "application/xml"
    baseName = "sitemap"
    isHTML = false
    isPlainText = true
    rel = "sitemap"
