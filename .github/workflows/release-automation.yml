name: Release Automation

on:
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - 'VERSION'

permissions:
  contents: write

jobs:
  cut-release:
    name: Cut Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Read Version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Only full release versions (vX.Y.Z) or development markers (vX.Y.Z-dev) are supported.
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev)?$ ]]; then
            echo "Error: Invalid version format in VERSION file: $VERSION (expected vX.Y.Z or vX.Y.Z-dev)"
            exit 1
          fi

          if [[ "$VERSION" == *-dev ]]; then
            echo "is_dev=true" >> $GITHUB_OUTPUT
            echo "Development version $VERSION detected. Skipping tag and branch creation."
            exit 0
          fi
          echo "is_dev=false" >> $GITHUB_OUTPUT

          # Extract patch number to determine if we need to cut a new release branch
          PATCH_NUM=$(echo "$VERSION" | sed -n 's/^v[0-9]*\.[0-9]*\.\([0-9]*\).*/\1/p')
          echo "patch_num=${PATCH_NUM}" >> $GITHUB_OUTPUT

          # Extract the vMAJOR.MINOR to create release branches, expose it as env var
          VERSION_XY=$(echo "$VERSION" | sed -n 's/\(^v[0-9]*\.[0-9]*\)\.[0-9]*.*/\1/p')
          echo "VERSION_XY=${VERSION_XY}" >> $GITHUB_ENV

          echo "Cutting release for version: $VERSION (Branch: $VERSION_XY Patch: $PATCH_NUM)"

      - name: Configure Git
        if: steps.version.outputs.is_dev != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Tag
        if: steps.version.outputs.is_dev != 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "tagging: ${VERSION}"
          if git ls-remote --tags origin refs/tags/${VERSION} | grep -q "refs/tags/${VERSION}$"; then
            echo "Tag ${VERSION} already exists. Skipping tag creation."
          else
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
            echo "Successfully pushed tag ${VERSION}"
          fi

      - name: Create and Push Release Branch
        if: steps.version.outputs.is_dev != 'true' && steps.version.outputs.patch_num == '0'
        run: |
          BRANCH_NAME="release-${VERSION_XY}"
          echo "branching: ${BRANCH_NAME}"
          if git ls-remote --heads origin refs/heads/${BRANCH_NAME} | grep -q "refs/heads/${BRANCH_NAME}$"; then
            echo "Branch ${BRANCH_NAME} already exists. Skipping branch creation."
          else
            # We are already on the commit that triggered the workflow (the merge commit).
            git checkout -b "${BRANCH_NAME}"
            git push origin "${BRANCH_NAME}"
            echo "Successfully pushed branch ${BRANCH_NAME}"
          fi
