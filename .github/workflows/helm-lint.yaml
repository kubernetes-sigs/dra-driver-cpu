name: Helm Lint
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'deployment/helm/**'
      - 'internal/driverconfig/**'
      - 'tools/gen-driverconfig-schema/**'
      # Read by test/render: the driver name sets the registrar socket name and
      # the byte budget left for the root, the flag registrations are what the
      # rendered command line is parsed against, and the image decides whether
      # the first argument is the program or a flag.
      - 'cmd/dracpu/**'
      - 'internal/ctxlog/**'
      - 'Dockerfile'
      - 'test/render/**'
      # The check runs through a Makefile target and is a Go test, so both can
      # change what it does without any of the paths above moving.
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/helm-lint.yaml'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Run Helm lint
        run: make helm-lint

      - name: Check the kubelet root derives the chart mounts and driver flag
        run: make helm-render-check

      - name: Check helm-docs is up to date
        run: make helm-docs-check

      - name: Check values.schema.json is up to date
        run: make helm-schema-check
